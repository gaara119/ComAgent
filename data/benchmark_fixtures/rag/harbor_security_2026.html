<h1>Harbor 安全与保留规范（2026）</h1>
<p>本页为原创虚构回归资料，规定 Harbor 资料服务2026年的演示安全策略，不是通用合规结论。</p>
<h2>审计日志</h2><p>Harbor 资料服务的审计日志保留期为90天。</p>
<p>保留期按日历天计算，到期进入删除队列；不得用备份保留期替代日志保留期。</p>
<h2>备份</h2><p>Harbor 资料服务的每日备份保留期为35天。</p>
<h2>静态加密</h2><p>Harbor 客户资料在静态存储时使用AES-256加密。</p>
<h2>传输加密</h2><p>Harbor 客户资料在网络传输时使用TLS 1.3。</p>
<p>本规范未给出下一次操作系统补丁安装日期。</p>
