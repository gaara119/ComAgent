name: comagent-d3-aw

services:
  aw-pg:
    image: postgres:16.15-alpine3.23@sha256:621a761097839bdb50207afd6b87a72f38e2d718dd46c3d744828d8917c4f1e0
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AW_POSTGRES_PASSWORD:?Run scripts/bootstrap_aw.py first}
      POSTGRES_DB: adventureworks
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${AW_PORT:-55433}:5432"
    volumes:
      - aw-data:/var/lib/postgresql/data
      - ./data/raw/adventureworks:/awdata:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adventureworks"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  aw-data:
