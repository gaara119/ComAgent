version: oct12-1
source: "方案.md §3.6.4; confirmed metric_definitions.json; user-authorized 12号任务.md"
authorized_defaults:
  region_scope: {invoice_sales: invoice.billing_country, customer: customer.country, explicit_user_scope_first: true}
  missing_period: {objects: [popular_track, repeat_customer_count, customer_ranking], scope: all_existing_data, preserve_confirmed_period: true}
  who_buys_most: {object: customer, metric: invoice_revenue}
  invoice_revenue_share: {denominator: all_invoices_same_period, exclude_metrics: [customer_count, detail_revenue]}
task_types:
  growth:
    required: [metric, time_scope.current, comparison.type]
    derivable:
      time_scope.base: current plus an explicit yoy or mom comparison
    level_if_missing: L2
  ratio:
    required: [numerator, denominator]
    level_if_missing: L2
  ranking:
    required: [metric, rank_object]
    defaults:
      top_n: 10
ambiguities:
  - id: popularity
    object: track
    trigger: [最受欢迎, 最热门, 最火, 热门曲目, 热门歌曲, 卖得最好]
    level: L1
    default: by_quantity
    requires_explicit_period: false
    options:
      - {id: by_quantity, label: 按购买数量, metric: purchased_quantity, expr: SUM(invoice_line.quantity)}
      - {id: by_revenue, label: 按销售额, metric: detail_revenue, expr: SUM(invoice_line.unit_price * invoice_line.quantity)}
      - {id: by_playlist, label: 按歌单收录次数, metric: playlist_memberships, expr: COUNT(playlist_track.playlist_id)}
  - id: customer_purchase_ranking
    object: customer
    trigger: [谁买得最多, 买得最多的客户]
    default: invoice_revenue
    level: L1
    source: Oct 12 user-authorized Chinook customer default
  - id: multi_candidate_value
    level: L2
    options: from_linker
  - id: invoice_country_scope
    level: L2
    options:
      - {id: billing_country, label: 按发票账单国家, column: invoice.billing_country}
      - {id: customer_country, label: 按客户所在地国家, column: customer.country}
invalidation:
  region_value: [result]
  region_column: [fields, schema, result]
  time_scope: [derived_period, result]
  metric: [grain, aggregation, fields, schema, result]
  rank_object: [grain, fields, schema, result]
  grouping: [grain, fields, schema, result]
  order: [result]
  comparison: [derived_period, result]
