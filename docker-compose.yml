name: comagent-d1

services:
  chinook-pg:
    image: postgres:16.15-alpine3.23@sha256:621a761097839bdb50207afd6b87a72f38e2d718dd46c3d744828d8917c4f1e0
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please configure POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-chinook}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${CHINOOK_PORT:-55432}:5432"
    volumes:
      - chinook-data:/var/lib/postgresql/data
      - ./data/db/Chinook_PostgreSql.import.sql:/docker-entrypoint-initdb.d/10-chinook.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  chinook-data:
